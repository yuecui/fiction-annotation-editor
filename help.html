<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiction Annotation Editor — Help</title>
  <link rel="stylesheet" href="vendor/tailwind.css?v=20261029-1">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    #help-content { line-height: 1.75; }
    #help-content h1 { font-size: 1.8rem; font-weight: 800; line-height: 1.25; margin-bottom: 1.2rem; }
    #help-content h2 { font-size: 1.35rem; font-weight: 750; margin: 2rem 0 .75rem; }
    #help-content h3 { font-size: 1.05rem; font-weight: 700; margin: 1.4rem 0 .5rem; }
    #help-content p { margin: .8rem 0; }
    #help-content ul, #help-content ol { padding-left: 1.5rem; margin: .75rem 0; }
    #help-content ul { list-style: disc; } #help-content ol { list-style: decimal; }
    #help-content li { margin: .3rem 0; }
    #help-content a { color: #4f46e5; text-decoration: underline; text-underline-offset: 3px; }
    #help-content pre { padding: 1rem; background: #f1f5f9; border-radius: .5rem; overflow: auto; font-size: .85rem; }
    #help-content code { font-size: .87em; background: #f1f5f9; padding: .1em .25em; border-radius: .2rem; }
    #help-content table { width: 100%; border-collapse: collapse; font-size: .85rem; margin: 1rem 0; }
    #help-content td, #help-content th { padding: .6rem .7rem; border: 1px solid #e2e8f0; text-align: left; }
    #help-content th { background: #f8fafc; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <header class="bg-slate-800 text-white shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold">Editor Help</h1>
        <p class="text-sm text-slate-300">Fiction Annotation Editor</p>
      </div>
      <a href="index.html" class="text-sm font-semibold bg-slate-700 hover:bg-slate-600 border border-slate-600 px-3 py-1.5 rounded-lg">
        Return to Editor
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 md:p-8">
    <article id="help-content" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 md:p-10 prose prose-slate max-w-none">
      <p class="text-slate-500">Loading editor guide…</p>
    </article>
  </main>

  <script>
    async function loadEditorGuide() {
      const container = document.getElementById('help-content');

      try {
        const response = await fetch('EDITOR_GUIDE.md', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Could not load EDITOR_GUIDE.md (${response.status})`);
        }

        const markdown = await response.text();
        container.innerHTML = marked.parse(markdown);
      } catch (error) {
        container.innerHTML = `
          <h2 class="text-xl font-bold mb-3">Unable to load the help guide</h2>
          <p class="mb-3">The help page reads <code>EDITOR_GUIDE.md</code>. It works normally when the project is served through GitHub Pages or another web server.</p>
          <p class="mb-3">If you opened these files directly from your computer, your browser may block local file access.</p>
          <p><a class="text-indigo-600 underline" href="EDITOR_GUIDE.md" target="_blank" rel="noopener noreferrer">Open EDITOR_GUIDE.md directly</a></p>
          <p class="mt-4 text-sm text-slate-500">${error.message}</p>
        `;
      }
    }

    loadEditorGuide();
  </script>
</body>
</html>
